[project]
name = "digital-healthcare-rppg"
version = "0.1.0"
description = "CPU local POS rPPG research baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
    # Pin for Linux UBFC AVI compatibility; 4.14 can segfault during frame retrieval.
    "opencv-python-headless==4.11.0.86",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
